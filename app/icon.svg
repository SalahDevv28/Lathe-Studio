<svg width="100%" viewBox="0 0 270 270" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>SNT network icon, loading screen base without border</title>
  <desc>A near-black rounded square with no border, a gradient hub centered in the middle, connected by eleven thicker gradient lines of varied non-sequential length to eleven outer nodes of varying size at irregular positions, ready for animation</desc>
  <defs>
    <linearGradient id="favicon-gradient" x1="20" y1="40" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F0467A"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="260" height="260" rx="48" fill="#0B0A12"/>
  <line x1="130" y1="130" x2="212" y2="130" stroke="url(#favicon-gradient)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="130" y1="130" x2="189" y2="168" stroke="url(#favicon-gradient)" stroke-width="5.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="130" y1="130" x2="167" y2="214" stroke="url(#favicon-gradient)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="130" y1="130" x2="119" y2="197" stroke="url(#favicon-gradient)" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <line x1="130" y1="130" x2="73" y2="193" stroke="url(#favicon-gradient)" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="130" y1="130" x2="60" y2="149" stroke="url(#favicon-gradient)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="130" y1="130" x2="44" y2="102" stroke="url(#favicon-gradient)" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <line x1="130" y1="130" x2="89" y2="79" stroke="url(#favicon-gradient)" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="130" y1="130" x2="121" y2="43" stroke="url(#favicon-gradient)" stroke-width="5.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="130" y1="130" x2="164" y2="63" stroke="url(#favicon-gradient)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="130" y1="130" x2="199" y2="90" stroke="url(#favicon-gradient)" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <circle cx="212" cy="130" r="8" fill="url(#favicon-gradient)"/>
  <circle cx="189" cy="168" r="11" fill="url(#favicon-gradient)"/>
  <circle cx="167" cy="214" r="6" fill="url(#favicon-gradient)"/>
  <circle cx="119" cy="197" r="9" fill="url(#favicon-gradient)"/>
  <circle cx="73" cy="193" r="12" fill="url(#favicon-gradient)"/>
  <circle cx="60" cy="149" r="7" fill="url(#favicon-gradient)"/>
  <circle cx="44" cy="102" r="9" fill="url(#favicon-gradient)"/>
  <circle cx="89" cy="79" r="6" fill="url(#favicon-gradient)"/>
  <circle cx="121" cy="43" r="10" fill="url(#favicon-gradient)"/>
  <circle cx="164" cy="63" r="8" fill="url(#favicon-gradient)"/>
  <circle cx="199" cy="90" r="7" fill="url(#favicon-gradient)"/>
  <circle cx="130" cy="130" r="14" fill="url(#favicon-gradient)"/>
</svg>
