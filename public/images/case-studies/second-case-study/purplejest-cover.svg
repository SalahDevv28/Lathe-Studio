<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF6FF"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>

    <radialGradient id="ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A9EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C9A9EE" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#7E22CE" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="640" y="0" width="560" height="630" fill="url(#dots)"/>
  <ellipse cx="960" cy="300" rx="360" ry="300" fill="url(#ambient)"/>

  <!-- eyebrow -->
  <text x="80" y="150" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3.5" fill="#7E22CE">REAL ESTATE PLATFORM</text>

  <!-- title: two-tone serif treatment -->
  <text x="76" y="248" font-family="Georgia, 'Playfair Display', serif" font-size="80" font-weight="700" fill="#18181B">Purple</text>
  <text x="76" y="332" font-family="Georgia, 'Playfair Display', serif" font-size="80" font-weight="700" fill="#7E22CE">Jest.</text>

  <!-- subtitle -->
  <text x="80" y="388" font-family="Inter, Arial, sans-serif" font-size="20" fill="#52525B">Apartment listings &amp; property browsing platform</text>

  <!-- bottom meta row -->
  <line x1="80" y1="556" x2="1120" y2="556" stroke="#7E22CE" stroke-opacity="0.14" stroke-width="1"/>
  <text x="80" y="588" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#71717A">SNT SOLUTIONS</text>
  <text x="1120" y="588" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#71717A" text-anchor="end">CASE STUDY</text>

  <!-- signature: abstract keyline skyline, original composition, not a recreation of any real screenshot -->
  <g transform="translate(0,0)" fill="none" stroke="#7E22CE" stroke-width="2.5" stroke-linejoin="round">
    <path d="M760,540 L760,360 L830,360 L830,300 L900,300 L900,360 L960,360 L960,220 L1030,220 L1030,540 Z" opacity="0.55"/>
    <path d="M1000,540 L1000,420 L1060,380 L1120,420 L1120,540 Z" opacity="0.85"/>
  </g>
  <!-- filled accent tower -->
  <path d="M900,540 L900,260 L960,260 L960,540 Z" fill="url(#purpleGrad)" opacity="0.92"/>
  <!-- keyline windows on accent tower -->
  <g fill="#FFFFFF" opacity="0.55">
    <rect x="912" y="284" width="12" height="16" rx="1.5"/>
    <rect x="936" y="284" width="12" height="16" rx="1.5"/>
    <rect x="912" y="316" width="12" height="16" rx="1.5"/>
    <rect x="936" y="316" width="12" height="16" rx="1.5"/>
    <rect x="912" y="348" width="12" height="16" rx="1.5"/>
    <rect x="936" y="348" width="12" height="16" rx="1.5"/>
    <rect x="912" y="380" width="12" height="16" rx="1.5"/>
    <rect x="936" y="380" width="12" height="16" rx="1.5"/>
  </g>
  <!-- location pin marker, small accent -->
  <g transform="translate(1075,255)">
    <path d="M0,0 C-16,0 -28,12 -28,28 C-28,50 0,78 0,78 C0,78 28,50 28,28 C28,12 16,0 0,0 Z" fill="url(#purpleGrad)"/>
    <circle cx="0" cy="27" r="10" fill="#FFFFFF"/>
  </g>
  <!-- ground line -->
  <line x1="700" y1="540" x2="1160" y2="540" stroke="#7E22CE" stroke-opacity="0.25" stroke-width="2"/>
</svg>
