<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1EFE8"/>
      <stop offset="100%" stop-color="#E6E1D2"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32,0 L0,0 0,32" fill="none" stroke="#14130F" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#14130F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- logo mark, matches the product's actual icon: black rounded square, cream diamond cutout -->
  <g transform="translate(80,72)">
    <rect x="0" y="0" width="44" height="44" rx="11" fill="#14130F"/>
    <polygon points="22,9 35,22 22,35 9,22" fill="#F1EFE8"/>
    <text x="58" y="24" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#14130F">Meridian</text>
    <text x="58" y="41" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#8A8880">ENGINEERING CRM</text>
  </g>

  <!-- eyebrow -->
  <text x="80" y="200" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="600" letter-spacing="3" fill="#4FA57C">CLIENT &amp; PROJECT OPERATIONS</text>

  <!-- title -->
  <text x="77" y="288" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" fill="#14130F">Team Meridian</text>

  <!-- subtitle -->
  <text x="80" y="330" font-family="Inter, Arial, sans-serif" font-size="19" fill="#6B6862">A purpose-built CRM for engineering consultancies —</text>
  <text x="80" y="357" font-family="Inter, Arial, sans-serif" font-size="19" fill="#6B6862">projects, clients, tasks and outreach in one workspace.</text>

  <!-- bottom meta row -->
  <line x1="80" y1="558" x2="1120" y2="558" stroke="#14130F" stroke-opacity="0.10" stroke-width="1"/>
  <text x="80" y="588" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="600" letter-spacing="1.5" fill="#8A8880">SNT SOLUTIONS</text>
  <text x="1120" y="588" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="600" letter-spacing="1.5" fill="#8A8880" text-anchor="end">CASE STUDY</text>

  <!-- signature: abstracted ops panel, original composition (not a copy of the real UI) -->
  <g transform="translate(700,90) rotate(2)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="420" height="440" rx="16" fill="#FBFAF6"/>

    <!-- mini stat row -->
    <g font-family="Inter, Arial, sans-serif">
      <text x="24" y="46" font-size="26" font-weight="800" fill="#14130F">124</text>
      <text x="24" y="64" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1.5" fill="#8A8880">ACTIVE OPS</text>

      <text x="150" y="46" font-size="26" font-weight="800" fill="#14130F">6</text>
      <text x="150" y="64" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1.5" fill="#8A8880">LIVE SYNC</text>

      <text x="276" y="46" font-size="26" font-weight="800" fill="#4FA57C">98%</text>
      <text x="276" y="64" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1.5" fill="#8A8880">ON TRACK</text>
    </g>

    <line x1="24" y1="88" x2="396" y2="88" stroke="#14130F" stroke-opacity="0.08"/>

    <!-- abstracted task/project rows with status dots, echoing the palette without copying real content -->
    <g>
      <circle cx="36" cy="120" r="5" fill="#C75450"/>
      <rect x="52" y="114" width="180" height="9" rx="4.5" fill="#14130F" fill-opacity="0.85"/>
      <rect x="330" y="112" width="66" height="16" rx="8" fill="#C75450" fill-opacity="0.15"/>
      <text x="363" y="124" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#C75450" text-anchor="middle">P-241</text>

      <circle cx="36" cy="158" r="5" fill="#4FA57C"/>
      <rect x="52" y="152" width="140" height="9" rx="4.5" fill="#14130F" fill-opacity="0.55"/>
      <rect x="330" y="150" width="66" height="16" rx="8" fill="#4FA57C" fill-opacity="0.15"/>
      <text x="363" y="162" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#4FA57C" text-anchor="middle">P-238</text>

      <circle cx="36" cy="196" r="5" fill="#5A9BD8"/>
      <rect x="52" y="190" width="200" height="9" rx="4.5" fill="#14130F" fill-opacity="0.55"/>
      <rect x="330" y="188" width="66" height="16" rx="8" fill="#5A9BD8" fill-opacity="0.15"/>
      <text x="363" y="200" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#5A9BD8" text-anchor="middle">P-236</text>

      <circle cx="36" cy="234" r="5" fill="#D98A3D"/>
      <rect x="52" y="228" width="160" height="9" rx="4.5" fill="#14130F" fill-opacity="0.4"/>
      <rect x="330" y="226" width="66" height="16" rx="8" fill="#D98A3D" fill-opacity="0.15"/>
      <text x="363" y="238" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#D98A3D" text-anchor="middle">P-233</text>

      <circle cx="36" cy="272" r="5" fill="#A87CC4"/>
      <rect x="52" y="266" width="120" height="9" rx="4.5" fill="#14130F" fill-opacity="0.4"/>
      <rect x="330" y="264" width="66" height="16" rx="8" fill="#A87CC4" fill-opacity="0.15"/>
      <text x="363" y="276" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#A87CC4" text-anchor="middle">P-231</text>
    </g>

    <line x1="24" y1="304" x2="396" y2="304" stroke="#14130F" stroke-opacity="0.08"/>

    <!-- small activity graph -->
    <g>
      <text x="24" y="330" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1.5" fill="#8A8880">PIPELINE ACTIVITY</text>
      <polyline points="24,404 70,388 116,394 162,362 208,372 254,338 300,348 346,316 392,326"
                fill="none" stroke="#4FA57C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="392" cy="326" r="5" fill="#4FA57C"/>
    </g>
  </g>
</svg>
