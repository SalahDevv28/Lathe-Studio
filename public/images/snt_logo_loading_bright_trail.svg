<svg width="100%" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg" role="img" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">SNT loading animation, bright clockwise trail with fade</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A near-black rounded square logo with a fixed gradient hub at center and eleven fixed outer nodes connected by static faint spokes. A bright glowing purple-to-pink line marks the newest connection clockwise around the ring, while the previous two connections remain visible but progressively dimmer, creating a smooth fading trail as it loops seamlessly.</desc>
<defs>
<linearGradient id="hubGrad4" x1="20" y1="40" x2="220" y2="220" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#8B5CF6"/>
<stop offset="1" stop-color="#F0467A"/>
</linearGradient>
<linearGradient id="ringGrad4" x1="20" y1="40" x2="220" y2="220" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#A78BFA"/>
<stop offset="1" stop-color="#FF6FA3"/>
</linearGradient>
<filter id="softBlur" x="-100%" y="-100%" width="300%" height="300%">
<feGaussianBlur stdDeviation="3.2"/>
</filter>

</defs>

