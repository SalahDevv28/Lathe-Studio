<title>SNT network icon, bordered and centered</title>
<desc>A near-black rounded square with a thin gradient border outline, a gradient hub centered in the middle of the icon, connected by eleven thicker gradient lines of varied non-sequential length to eleven outer nodes of varying size at irregular positions</desc>
